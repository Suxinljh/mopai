# 推送到 master/main 时：先跑类型检查 + 测试，通过后构建镜像并推到 Docker Hub。
#
# 需要两个仓库 Secret（GitHub → Settings → Secrets and variables → Actions → New repository secret）：
#   DOCKERHUB_USERNAME   suxinljh
#   DOCKERHUB_TOKEN      Docker Hub 的 Access Token（权限勾 Read & Write），不是登录密码
#
# 产出三个 tag（都是同一个镜像摘要）：
#   suxinljh/mopai:latest              rolling，永远指向最后一次成功构建
#   suxinljh/mopai:YYYY-MM-DD          东八区日期
#   suxinljh/mopai:sha-<7 位短 sha>     每次提交唯一，可精确追溯到某个 commit
# 同一天推多次，日期 tag 会被后一次覆盖 —— 这正是「拉今天最新的」想要的行为；
# 要精确固定到某一次构建，用 sha- tag。

name: docker

on:
  push:
    branches: [master, main]
  workflow_dispatch: # 也允许在 Actions 页面手动点一次

# 连推多次时取消上一次还在跑的构建，避免两个任务同时抢着推 latest。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: suxinljh/mopai

jobs:
  # 质量闸门：不过就不出新镜像。
  # 想让任何提交都出镜像，把整个 verify job 删掉，并去掉 build 的 `needs: verify`。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # buildx 是 build-push-action 和 gha 缓存的前提。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 日期按东八区算：runner 是 UTC，早上 8 点前推会差一天。
      - id: stamp
        run: echo "date=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.stamp.outputs.date }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=mopai
            org.opencontainers.image.description=MoPai / wechat-md-studio - Markdown to WeChat article formatter
            org.opencontainers.image.revision=${{ github.sha }}

      # 目标是 x86_64 的 NAS，本机 docker 也是 linux/amd64。
      # 要顺带出 arm64：把 platforms 改成 linux/amd64,linux/arm64（构建时间约翻倍）。
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
